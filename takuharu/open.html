<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex">
  <title>たくはるファイナンス｜明細を開く</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #FFF1F4; color: #5A4A50;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 340px; text-align: center;
      background: #fff; border-radius: 22px;
      padding: 32px 24px; box-shadow: 0 10px 30px rgba(255, 107, 138, .15);
    }
    .emoji { font-size: 44px; line-height: 1; }
    h1 { font-size: 18px; font-weight: 800; margin: 14px 0 6px; }
    p  { font-size: 13px; margin: 0 0 22px; color: #9B858C; }
    a.btn {
      display: block; text-decoration: none; font-weight: 800;
      padding: 14px 16px; border-radius: 999px; margin: 10px 0; font-size: 15px;
    }
    a.app { background: #FF6B8A; color: #fff; }
    a.web { background: #fff; color: #FF6B8A; border: 1.5px solid #FFD3DE; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧾💗</div>
    <h1>明細を開いています…</h1>
    <p>アプリが自動で開かないときは、下のボタンをタップしてね。</p>
    <a id="openApp" class="btn app" href="#">アプリで開く</a>
    <a id="openWeb" class="btn web" href="#">Web版で開く</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var r = params.get('r') || '';
      // 未インストール時・Web利用時のフォールバック先（Flutter Web が ?r= を読んで開く）。
      var webUrl = 'https://fffuttta-design.github.io/finance-apps/takuharu/?r=' + encodeURIComponent(r);
      // Android: intent 経由で takuharu:// を叩く（未インストールなら webUrl へ）。
      var intentUrl = 'intent://receipt/' + encodeURIComponent(r)
        + '#Intent;scheme=takuharu;package=com.takuharu.finance;S.browser_fallback_url='
        + encodeURIComponent(webUrl) + ';end';
      var schemeUrl = 'takuharu://receipt/' + encodeURIComponent(r);
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);

      document.getElementById('openApp').href = isAndroid ? intentUrl : schemeUrl;
      document.getElementById('openWeb').href = webUrl;

      if (!r) { location.replace('https://fffuttta-design.github.io/finance-apps/takuharu/'); return; }

      // 自動で開きにいく。
      if (isAndroid) {
        location.href = intentUrl;
      } else {
        // iOS/PC: カスタムスキームを試し、開けなければ Web版へ。
        var t = setTimeout(function () { location.href = webUrl; }, 1400);
        window.addEventListener('pagehide', function () { clearTimeout(t); });
        location.href = schemeUrl;
      }
    })();
  </script>
</body>
</html>
